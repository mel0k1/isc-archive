name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc }
          - { os: ubuntu-latest, cc: clang }
          - { os: macos-latest,  cc: clang }
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - run: make -j
      - run: make test

  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ASan + UBSan
        run: >
          make clean && make test
          CC=gcc
          CFLAGS="-O1 -g -std=c99 -Wall -Wextra -pthread -fsanitize=address,undefined -fno-omit-frame-pointer -D_FILE_OFFSET_BITS=64 -D_POSIX_C_SOURCE=200809L"
          LDLIBS="-lm -pthread -fsanitize=address,undefined"
      - name: ThreadSanitizer
        run: >
          make clean && make test
          CC=gcc
          CFLAGS="-O1 -g -std=c99 -Wall -Wextra -pthread -fsanitize=thread -D_FILE_OFFSET_BITS=64 -D_POSIX_C_SOURCE=200809L"
          LDLIBS="-lm -pthread -fsanitize=thread"
